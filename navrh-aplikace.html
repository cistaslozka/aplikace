<style>
html, body { margin: 0; height: 100%; }
body { background: #f4f7fb; font-family: 'Inter', system-ui, sans-serif; }
a { color: #047857; } a:hover { color: #065f46; }
.proto-bar { position: sticky; top: 0; z-index: 50; background: #0b1b29; color: #cbd5e1; display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 10px 16px; font-size: 13px; }
.proto-bar strong { color: #ffffff; font-family: 'Plus Jakarta Sans', sans-serif; font-size: 14px; }
.proto-bar .tabs { display: flex; flex-wrap: wrap; gap: 4px; margin-left: auto; }
.proto-bar button { border: 0; background: transparent; color: #cbd5e1; font: inherit; font-weight: 600; padding: 7px 12px; border-radius: 8px; cursor: pointer; }
.proto-bar button.on { background: #10b981; color: #0f2537; }
.phone-stage { padding: 32px 16px; display: flex; justify-content: center; }
.phone-stage > div { border-radius: 36px; box-shadow: 0 24px 60px -24px rgba(15, 37, 55, .45); }
/* Přehled */
.shell{display:flex;flex-wrap:wrap;min-height:100%;background:#f4f7fb;font-family:'Inter',system-ui,sans-serif;color:#334155}
.side{flex:1 1 248px;max-width:248px;background:#0f2537;color:#cbd5e1;padding:24px 16px;box-sizing:border-box;display:flex;flex-direction:column;gap:24px}
.content{flex:999 1 560px;min-width:0;padding:28px 40px 56px;box-sizing:border-box;display:flex;flex-direction:column;gap:24px}
.nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;color:#cbd5e1;text-decoration:none;font-weight:500;font-size:14px}
.nav a:hover{background:rgba(255,255,255,.06);color:#fff}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
.span2{grid-column:span 2}
.num{font-variant-numeric:tabular-nums}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-size:12px;letter-spacing:.4px;text-transform:uppercase;color:#64748b;font-weight:600;padding:0 12px 10px 0}
.tbl td{padding:12px 12px 12px 0;border-top:1px solid #e2e8f0;white-space:nowrap}
@media (max-width:900px){.side{max-width:none;flex-basis:100%}.content{padding:20px 16px 40px}.g3{grid-template-columns:minmax(0,1fr)}.span2{grid-column:auto}}
/* Nová faktura */
.num{font-variant-numeric:tabular-nums}
.card{background:#ffffff;border:1px solid #e2e8f0;border-radius:16px;padding:22px;display:flex;flex-direction:column;gap:16px}
.lbl{display:block;font-size:13px;font-weight:600;color:#0f2537;margin-bottom:6px}
.inp{width:100%;box-sizing:border-box;border:1.5px solid #e2e8f0;border-radius:10px;background:#f8fafc;font:inherit;font-size:14px;color:#0f2537;padding:11px 12px}
.inp:focus{outline:none;border-color:#10b981;background:#fff}
.h2{margin:0;font-family:'Plus Jakarta Sans',sans-serif;font-size:17px;color:#0f2537}
.items{width:100%;border-collapse:collapse;font-size:14px}
.items th{text-align:left;font-size:12px;letter-spacing:.4px;text-transform:uppercase;color:#64748b;font-weight:600;padding:0 8px 8px 0;white-space:nowrap}
.items td{padding:6px 8px 6px 0;border-top:1px solid #e2e8f0}
/* Faktury */
.shell{display:flex;flex-wrap:wrap;min-height:100%;background:#f4f7fb;font-family:'Inter',system-ui,sans-serif;color:#334155}
.side{flex:1 1 248px;max-width:248px;background:#0f2537;color:#cbd5e1;padding:24px 16px;box-sizing:border-box;display:flex;flex-direction:column;gap:24px}
.content-d{flex:999 1 560px;min-width:0;padding:28px 40px 56px;box-sizing:border-box;display:flex;flex-direction:column;gap:22px}
.nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;color:#cbd5e1;text-decoration:none;font-weight:500;font-size:14px}
.nav a:hover{background:rgba(255,255,255,.06);color:#fff}
.num{font-variant-numeric:tabular-nums}
.tbl-d{width:100%;border-collapse:collapse;font-size:14px}
.tbl-d th{text-align:left;font-size:12px;letter-spacing:.4px;text-transform:uppercase;color:#64748b;font-weight:600;padding:14px 12px;background:#f8fafc;border-bottom:1px solid #e2e8f0;white-space:nowrap}
.tbl-d td{padding:14px 12px;border-bottom:1px solid #e2e8f0;white-space:nowrap}
.tbl-d tr:last-child td{border-bottom:0}
.sel{border:1.5px solid #e2e8f0;border-radius:10px;background:#ffffff;font:inherit;font-size:14px;color:#0f2537;padding:10px 12px;min-height:44px}
@media (max-width:900px){.side{max-width:none;flex-basis:100%}.content-d{padding:20px 16px 40px}}
/* Mobil */
.num{font-variant-numeric:tabular-nums}
</style>
</head>

<main class="content">
  <header style="display:flex;flex-wrap:wrap;align-items:center;gap:16px">
    <label for="search" style="flex:1 1 280px;display:flex;align-items:center;gap:10px;background:#ffffff;border:1px solid #e2e8f0;border-radius:12px;padding:0 14px;max-width:520px">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.6" y2="16.6"></line></svg>
      <input id="search" type="search" placeholder="Hledat fakturu, klienta nebo IČO" style="border:0;outline:0;flex:1;font:inherit;font-size:14px;padding:12px 0;background:transparent;color:#0f2537">
    </label>
    <div style="margin-left:auto;display:flex;align-items:center;gap:12px">
      <button type="button" aria-label="Upozornění" style="width:44px;height:44px;border-radius:12px;border:1px solid #e2e8f0;background:#ffffff;display:grid;place-items:center;cursor:pointer;position:relative">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0f2537" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.7 21a2 2 0 0 1-3.4 0"></path></svg>
        <span style="position:absolute;top:9px;right:10px;width:8px;height:8px;border-radius:50%;background:#dc2626"></span>
      </button>
      <div style="display:flex;align-items:center;gap:10px">
        <div style="width:40px;height:40px;border-radius:50%;background:#0f2537;color:#ffffff;display:grid;place-items:center;font-weight:700;font-size:14px">JN</div>
        <div style="line-height:1.25"><div style="font-weight:600;color:#0f2537;font-size:14px">Jan Novák</div><div style="font-size:12px;color:#64748b">OSVČ · IČO 08912345</div></div>
      </div>
    </div>
  </header>

  <section style="display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px">
    <div>
      <h1 style="margin:0;font-family:'Plus Jakarta Sans',sans-serif;font-size:32px;color:#0f2537;letter-spacing:-.5px">Dobrý den, Jane</h1>
      <p style="margin:6px 0 0;color:#64748b;font-size:15px">Úterý 20. října 2026 · 2 faktury jsou po splatnosti</p>
    </div>
    <button type="button" style="display:flex;align-items:center;gap:8px;border:1.5px solid #e2e8f0;background:#ffffff;color:#0f2537;font:inherit;font-weight:600;font-size:14px;padding:10px 16px;border-radius:10px;cursor:pointer">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"></rect><rect x="14" y="3" width="7" height="7" rx="1"></rect><rect x="3" y="14" width="7" height="7" rx="1"></rect><rect x="14" y="14" width="7" height="7" rx="1"></rect></svg>
      Upravit přehled
    </button>
  </section>

  <section class="g3" aria-label="Dlaždice přehledu">
    <article style="background:#ffffff;border:1px solid #e2e8f0;border-radius:16px;padding:22px;display:flex;flex-direction:column;gap:12px">
      <div style="display:flex;justify-content:space-between;align-items:center"><h2 style="margin:0;font-size:14px;font-weight:600;color:#64748b">Neuhrazené faktury</h2><a href="#" data-go="Doklady" style="font-size:13px;font-weight:600;text-decoration:none">Zobrazit</a></div>
      <div class="num" style="font-family:'Plus Jakarta Sans',sans-serif;font-size:32px;font-weight:800;color:#0f2537">86 800 Kč</div>
      <div style="font-size:13px;color:#64748b">4 faktury čekají na úhradu · nejbližší splatnost 22. 10.</div>
    </article>
    <article style="background:#ffffff;border:1px solid #e2e8f0;border-radius:16px;padding:22px;display:flex;flex-direction:column;gap:12px">
      <div style="display:flex;justify-content:space-between;align-items:center"><h2 style="margin:0;font-size:14px;font-weight:600;color:#64748b">Po splatnosti</h2><span style="font-size:12px;font-weight:700;color:#b91c1c;background:#fef2f2;padding:3px 10px;border-radius:999px">Vyžaduje pozornost</span></div>
      <div class="num" style="font-family:'Plus Jakarta Sans',sans-serif;font-size:32px;font-weight:800;color:#b91c1c">35 900 Kč</div>
      <a href="#" style="font-size:13px;font-weight:600;text-decoration:none">Poslat 2 upomínky jedním kliknutím →</a>
    </article>
    <article style="background:#ffffff;border:1px solid #e2e8f0;border-radius:16px;padding:22px;display:flex;flex-direction:column;gap:12px">
      <div style="display:flex;justify-content:space-between;align-items:center"><h2 style="margin:0;font-size:14px;font-weight:600;color:#64748b">Obrat a limit pro DPH</h2><span style="font-size:12px;font-weight:700;color:#047857;background:#ecfdf5;padding:3px 10px;border-radius:999px">V pořádku</span></div>
      <div class="num" style="font-family:'Plus Jakarta Sans',sans-serif;font-size:32px;font-weight:800;color:#0f2537">612 400 Kč</div>
      <div style="height:10px;border-radius:999px;background:#eef2f7;overflow:hidden"><div style="width:31%;height:100%;background:#10b981;border-radius:999px"></div></div>
      <div class="num" style="font-size:13px;color:#64748b">31 % z limitu 2 000 000 Kč za rok 2026</div>
    </article>

    <article class="span2" style="background:#ffffff;border:1px solid #e2e8f0;border-radius:16px;padding:22px;display:flex;flex-direction:column;gap:18px">
      <div style="display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:8px">
        <h2 style="margin:0;font-family:'Plus Jakarta Sans',sans-serif;font-size:18px;color:#0f2537">Příjmy za posledních 6 měsíců</h2>
        <div class="num" style="font-size:13px;color:#64748b">Celkem <strong style="color:#0f2537">354 700 Kč</strong></div>
      </div>
      <div style="display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:14px;align-items:end;height:190px;border-bottom:1px solid #e2e8f0">
        <div data-for="months" data-as="m" style="display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;height:100%">
            <span class="num" style="font-size:12px;color:#64748b">{{m.label}}</span>
            <span style="{{m.bar}}"></span>
          </div>
        
      </div>
      <div style="display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:14px;margin-top:-8px">
        <span data-for="months" data-as="m" style="text-align:center;font-size:12px;font-weight:600;color:#64748b">{{m.name}}</span>
        
      </div>
    </article>

    <article style="background:#0f2537;color:#cbd5e1;border-radius:16px;padding:22px;display:flex;flex-direction:column;gap:12px">

      <a href="#" style="display:flex;align-items:center;justify-content:space-between;background:rgba(255,255,255,.07);color:#ffffff;font-weight:600;text-decoration:none;padding:14px 16px;border-radius:12px;font-size:15px">Nová smlouva <span aria-hidden="true">→</span></a>
      <a href="#" style="display:flex;align-items:center;justify-content:space-between;background:rgba(255,255,255,.07);color:#ffffff;font-weight:600;text-decoration:none;padding:14px 16px;border-radius:12px;font-size:15px">Přidat klienta z ARES <span aria-hidden="true">→</span></a>
      <a href="#" style="display:flex;align-items:center;justify-content:space-between;background:rgba(255,255,255,.07);color:#ffffff;font-weight:600;text-decoration:none;padding:14px 16px;border-radius:12px;font-size:15px">Zálohová faktura <span aria-hidden="true">→</span></a>
    </article>

    <article class="span2" style="background:#ffffff;border:1px solid #e2e8f0;border-radius:16px;padding:22px;display:flex;flex-direction:column;gap:14px">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <h2 style="margin:0;font-family:'Plus Jakarta Sans',sans-serif;font-size:18px;color:#0f2537">Poslední doklady</h2>
        <a href="#" data-go="Doklady" style="font-size:13px;font-weight:600;text-decoration:none">Všechny doklady →</a>
      </div>
      <div style="overflow-x:auto">
        <table class="tbl">
          <thead><tr><th>Číslo</th><th>Klient</th><th>Splatnost</th><th style="text-align:right">Částka</th><th style="text-align:right;padding-right:0">Stav</th></tr></thead>
          <tbody>
            <tr data-for="docs" data-as="d">
                <td class="num" style="font-weight:600;color:#0f2537">{{d.no}}</td>
                <td>{{d.client}}</td>
                <td class="num">{{d.due}}</td>
                <td class="num" style="text-align:right">{{d.amount}}</td>
                <td style="text-align:right;padding-right:0"><span style="{{d.pill}}">{{d.status}}</span></td>
              </tr>
            
          </tbody>
        </table>
      </div>

    if (t) { go(t.getAttribute('data-tab')); return; }
    var a = e.target.closest('a');
    if (a && a.getAttribute('href') === '#') {
      e.preventDefault();
      if (a.hasAttribute('data-go')) go(a.getAttribute('data-go'));
    }
  });
  draw();
})();
</script>
</body>
</html>
